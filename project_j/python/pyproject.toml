[project]
name = "project-j-p0"
version = "0.1.0"
description = "Project J isolated simulation application and independent probes; no child entry"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "openai>=3.29.0",
    "openai-codex==0.163.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project_j"

[project.scripts]
project-j-probe = "project_j.probe:main"
project-j-init = "project_j.platform.models.init:main"
project-j-scorer-init = "project_j.platform.speech.init:main"
project-j-tts-init = "project_j.platform.tts.init:main"
project-j-measure = "project_j.latency:main"
project-j-serve = "project_j.interface.api:main"
project-j-export-schema = "project_j.interface.api:export_schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint.isort]
known-first-party = ["project_j"]
