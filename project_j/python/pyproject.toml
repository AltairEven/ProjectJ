[project]
name = "project-j-p0"
version = "0.1.0"
description = "Project J P0 isolated contract and connection probes; no application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint.isort]
known-first-party = ["project_j"]
