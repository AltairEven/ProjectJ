[project]
name = "project-j-tts"
version = "0.1.0"
description = "Project J local speech synthesis (ADR-0016); separate from the main app and the scorer"
requires-python = ">=3.14,<3.15"
dependencies = [
    "huggingface-hub>=2.2.0",
    "mlx-audio==0.5.9",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project_j_tts"

[tool.uv]
# MLX runs only on Apple Silicon Macs.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
project-j-tts = "project_j_tts.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["project_j_tts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
]
